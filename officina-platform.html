<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officina.ch — Karriereplattform für Apotheken</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --pine:#1B1D1B; --paper:#FFFFFF; --panel:#F7F8F6; --panel-highlight:#EAF7EC;
  --amber:#2E9E3F; --amber-dark:#237D33; --line:#E5E7E4; --text2:#62675F; --danger:#DC2626;
  --shadow-sm:0 1px 2px rgba(20,20,20,0.04), 0 1px 3px rgba(20,20,20,0.06);
  --shadow-md:0 4px 14px rgba(20,20,20,0.07), 0 2px 6px rgba(20,20,20,0.05);
  --shadow-lg:0 20px 40px rgba(15,23,20,0.14);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:#1A1D1A;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:800;margin:0;letter-spacing:-0.025em;}
a{color:#1A1D1A;text-decoration:none;cursor:pointer;}
input,select,textarea{padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;width:100%;transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(46,158,63,0.15);}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
.btn-primary{background:var(--amber);color:#fff;border:none;border-radius:9px;padding:13px 24px;font-size:14.5px;font-weight:700;display:inline-block;box-shadow:0 2px 8px rgba(46,158,63,0.28);transition:background .15s, transform .1s;}
.btn-primary:hover{background:var(--amber-dark);transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.55;box-shadow:none;transform:none;}
.btn-ghost{background:#fff;color:#1A1D1A;border:1px solid var(--line);border-radius:9px;padding:12px 22px;font-size:14.5px;font-weight:600;display:inline-block;transition:border-color .15s, background .15s;}
.btn-ghost:hover{border-color:#1A1D1A;background:var(--panel);}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-sm);}
.tag{font-size:11.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:#3F453F;display:inline-flex;align-items:center;gap:5px;font-weight:600;background:#fafafa;}
.tag.accent{border-color:#BFE8C9;color:var(--amber-dark);background:var(--panel-highlight);}
.container{max-width:1100px;margin:0 auto;padding:0 32px;}
.field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:16px;}
header.topbar{background:var(--pine);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,0.06);}
header.topbar .row{padding:13px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1100px;margin:0 auto;}
header.topbar a.logo{font-weight:800;font-size:18px;color:#fff;flex-shrink:0;letter-spacing:-0.02em;}
header.topbar a.logo span{color:var(--amber);}
nav.navlinks{display:flex;gap:18px;flex:1;margin-left:26px;flex-wrap:wrap;}
nav.navlinks a{color:rgba(255,255,255,0.82);font-size:13.5px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s;white-space:nowrap;}
nav.navlinks a:hover{color:#fff;}
nav.navlinks a.active{color:var(--amber);border-bottom:2px solid var(--amber);}
.navright{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.job-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px 26px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:14px;transition:box-shadow .2s, transform .2s, border-color .2s;}
.job-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px) scale(1.012);border-color:#cfe4d3;z-index:2;position:relative;}
.job-icon{width:48px;height:48px;border-radius:12px;background:var(--panel-highlight);color:var(--amber-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
#app{min-height:60vh;}
.msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:8px;}
.msg.error{color:#991B1B;background:#FEF2F2;border:1px solid #FECACA;}
.msg.ok{color:var(--amber-dark);background:var(--panel-highlight);border:1px solid #BFE8C9;}
.hero{position:relative;overflow:hidden;}
.hero-imgs{position:relative;min-height:400px;display:flex;align-items:center;}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:hfade 24s infinite;}
@keyframes hfade{0%{opacity:0;}4%{opacity:1;}20%{opacity:1;}24%{opacity:0;}100%{opacity:0;}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,20,15,0.25) 0%, rgba(15,20,15,0.5) 60%, rgba(15,20,15,0.82) 100%);}
.hero-content{position:relative;padding:90px 32px 34px;text-align:center;}
.eyebrow{font-size:13px;color:var(--amber);font-weight:700;letter-spacing:0.09em;text-transform:uppercase;margin-bottom:16px;}
.hero-title{font-size:clamp(30px,5vw,52px);line-height:1.06;color:#fff;font-weight:800;letter-spacing:-0.03em;text-shadow:0 2px 24px rgba(0,0,0,0.35);max-width:780px;margin:0 auto;}
.hero-sub{color:rgba(255,255,255,0.88);font-size:16px;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto;}
.stat-row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.stat{color:#fff;text-align:center;}
.stat b{display:block;font-size:22px;font-weight:800;}
.stat span{font-size:12.5px;opacity:0.8;}
.searchbar{position:relative;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;margin:-46px auto 40px;max-width:820px;display:flex;gap:10px;flex-wrap:wrap;border:1px solid var(--line);}
.auth-wrap{display:flex;justify-content:center;padding:20px 0 40px;}
.pricing-card{flex:1 1 260px;border-radius:18px;padding:30px;position:relative;transition:transform .15s;}
.pricing-card:hover{transform:translateY(-3px);}
.split-card{flex:1 1 320px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow-sm);}
.section-title{font-size:24px;margin-bottom:6px;}
.section-underline{width:46px;height:3px;background:var(--amber);border-radius:2px;margin-bottom:24px;}
.canton-chip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;transition:border-color .15s, box-shadow .15s;}
.canton-chip:hover{border-color:var(--amber);box-shadow:var(--shadow-sm);}
.canton-chip b{color:var(--amber-dark);}
.service-card{flex:1 1 220px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;}
.service-icon{font-size:26px;margin-bottom:10px;}
.ad-banner{background:linear-gradient(135deg,#EAF7EC,#F7F8F6);border:1px dashed #BFE8C9;border-radius:16px;padding:26px;text-align:center;margin:30px 0;}
.newsletter-box{background:var(--amber);border-radius:18px;padding:32px;color:#fff;}
.newsletter-box input[type=email]{border:none;padding:13px;border-radius:9px;}
.site-footer{background:var(--pine);color:#fff;margin-top:50px;padding:44px 32px 26px;}
.footer-cols{display:flex;gap:40px;flex-wrap:wrap;max-width:1100px;margin:0 auto 30px;}
.footer-col h4{font-size:13px;color:#fff;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;}
.footer-col a{display:block;color:rgba(255,255,255,0.75);font-size:13.5px;margin-bottom:9px;}
.footer-col a:hover{color:var(--amber);}
.social-row{display:flex;gap:14px;max-width:1100px;margin:0 auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12);}
.social-row a{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:15px;}
.faq-item{border-bottom:1px solid var(--line);padding:16px 0;}
.faq-q{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;cursor:pointer;}
.faq-a{font-size:13.5px;color:var(--text2);margin-top:10px;line-height:1.6;display:none;}
.faq-item.open .faq-a{display:block;}
.compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.compare-table th,.compare-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center;}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;}
.compare-table th{font-size:13px;color:var(--text2);}
@media (max-width:760px){ nav.navlinks{display:none;} .searchbar{flex-direction:column;} .footer-cols{gap:26px;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="row">
    <a href="#/" class="logo">OFFICINA<span>.CH</span></a>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="navright" id="navright"></div>
  </div>
</header>

<div id="app"></div>

<footer class="site-footer">
  <div class="footer-cols">
    <div class="footer-col">
      <h4>Beliebte Funktionen</h4>
      <a href="#/">Jobs</a>
      <a href="#/springer">Springer &amp; Ferienvertretung</a>
      <a href="#/profile">Profil erstellen</a>
      <a href="#/cantons">Alle Kantone</a>
    </div>
    <div class="footer-col">

  </div>
</footer>

<script>
const SUPABASE_URL = "https://zeliherrtisicijdgvuh.supabase.co";
const SUPABASE_KEY = "sb_publishable_zrNIQFWU7WOXC-w72kRBFA_Bzkn8505";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const HERO_IMAGES = [
  "https://images.unsplash.com/photo-1642055514517-7b52288890ec?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1576602976047-174e57a47881?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1580281657527-47f249e8f4df?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1622230208995-0f26eba75875?auto=format&fit=crop&w=2000&q=75",
];

const CANTONS = [
  {code:"ZH",name:"Zürich"},{code:"BE",name:"Bern"},{code:"LU",name:"Luzern"},{code:"UR",name:"Uri"},
  {code:"SZ",name:"Schwyz"},{code:"OW",name:"Obwalden"},{code:"NW",name:"Nidwalden"},{code:"GL",name:"Glarus"},
  {code:"ZG",name:"Zug"},{code:"FR",name:"Freiburg"},{code:"SO",name:"Solothurn"},{code:"BS",name:"Basel-Stadt"},
  {code:"BL",name:"Basel-Landschaft"},{code:"SH",name:"Schaffhausen"},{code:"AR",name:"Appenzell Ausserrhoden"},
  {code:"AI",name:"Appenzell Innerrhoden"},{code:"SG",name:"St. Gallen"},{code:"GR",name:"Graubünden"},
  {code:"AG",name:"Aargau"},{code:"TG",name:"Thurgau"},{code:"TI",name:"Tessin"},{code:"VD",name:"Waadt"},
  {code:"VS",name:"Wallis"},{code:"NE",name:"Neuenburg"},{code:"GE",name:"Genf"},{code:"JU",name:"Jura"},
];
const PROFESSIONS = [
  {key:"apotheker",label:"Apotheker:in",icon:"⚕"},
  {key:"pharma_assistent",label:"Pharma-Assistent:in",icon:"✚"},
  {key:"praktikum",label:"Praktikum",icon:"🎓"},
];
function profLabel(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.label : k; }
function profIcon(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.icon : "⚕"; }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cantonOptions(selected){
  return CANTONS.map(c => `<option value="${c.code}" ${c.code===selected?"selected":""}>${c.name}</option>`).join("");
}

let currentSession = null;
let currentProfile = null;

async function refreshSession(){
  const { data } = await sb.auth.getSession();
  currentSession = data.session;
  if (currentSession) {
    const { data: prof } = await sb.from("profiles").select("*").eq("id", currentSession.user.id).single();
    currentProfile = prof;
  } else {
    currentProfile = null;
  }
  renderNav();
}

function renderNav(){
  const links = [
    ["#/", "Jobs"],
    ["#/springer", "Springer"],
    ["#/profile", "Profil erstellen"],
    ["#/pricing", "Preise"],
  ];
  if (currentProfile && currentProfile.role === "candidate") {
    links.push(["#/favorites", "Favoriten"]);
    links.push(["#/my-applications", "Bewerbungen"]);
  }
  if (currentProfile && currentProfile.role === "employer") {
    links.push(["#/employer-dashboard", "Dashboard"]);
  }
  if (currentProfile && currentProfile.role === "admin") {
    links.push(["#/admin", "Admin"]);
  }
  const hash = location.hash || "#/";
  document.getElementById("navlinks").innerHTML = links.map(([href,label]) =>
    `<a href="${href}" class="${hash===href?'active':''}">${label}</a>`
  ).join("");

  const right = document.getElementById("navright");
  if (currentSession) {
    right.innerHTML = `<button class="btn-primary" style="padding:9px 18px;font-size:13.5px;box-shadow:none;" onclick="logout()">Abmelden</button>`;
  } else {
    right.innerHTML = `<a href="#/login" class="btn-ghost" style="padding:9px 16px;font-size:13.5px;background:transparent;border-color:rgba(255,255,255,0.35);color:#fff;">Login</a>
    <a href="#/register" class="btn-primary" style="padding:9px 18px;font-size:13.5px;">Registrieren</a>`;
  }
}

async function logout(){
  await sb.auth.signOut();
  await refreshSession();
  location.hash = "#/";
}

function setApp(html){ document.getElementById("app").innerHTML = html; }

function newsletterBlock(){
  return `
    <div class="newsletter-box" style="margin:36px 0;">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px;">Newsletter — 10% auf dein erstes Inserat</div>
          <div style="font-size:14px;opacity:0.92;">Erhalte neue Stellen und Angebote direkt in dein Postfach.</div>
        </div>
        <form onsubmit="return subscribeNewsletter(event)" style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="email" required placeholder="Deine E-Mail-Adresse" style="min-width:220px;">
          <button class="btn-ghost" type="submit" style="background:#fff;border:none;color:var(--amber-dark);font-weight:700;">Anmelden</button>
        </form>
      </div>
    </div>
  `;
}
function subscribeNewsletter(e){
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.textContent = "✓ Angemeldet";
  return false;
}

function adBanner(){
  return `
    <div class="ad-banner">
      <div style="font-size:11px;letter-spacing:0.08em;color:var(--text2);text-transform:uppercase;margin-bottom:6px;">Werbung</div>
      <div style="font-size:15px;font-weight:700;">Platz für Medikamenten-Marken &amp; Pharma-Partner</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px;">Erreiche Fachpersonal aus Schweizer Apotheken — Anzeigenplätze auf Anfrage.</div>
    </div>
  `;
}

function servicesBlock(){
  const services = [
    {icon:"📋", title:"Stellenausschreibung", text:"Feste Anstellungen, Teilzeit &amp; Praktika veröffentlichen."},
    {icon:"⏱", title:"Springer-Pool", text:"Kurzfristige Ferienvertretungen schnell besetzen."},
    {icon:"💬", title:"Direkter Chat", text:"Direkt mit Bewerbenden in Kontakt treten."},
    {icon:"📊", title:"Statistiken", text:"Aufrufe &amp; Bewerbungen deiner Inserate im Überblick."},
    {icon:"🏥", title:"Firmenprofil", text:"Apotheke &amp; Team mit Fotos präsentieren."},
    {icon:"⭐", title:"Premium-Listing", text:"Höhere Sichtbarkeit in der Stellensuche."},
  ];
  return `
    <h2 class="section-title">Dienstleistungen für Arbeitgeber</h2>
    <div class="section-underline"></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;">
      ${services.map(s=>`
        <div class="service-card">
          <div class="service-icon">${s.icon}</div>
          <div style="font-weight:700;font-size:14.5px;margin-bottom:4px;">${s.title}</div>
          <div style="font-size:13px;color:var(--text2);line-height:1.5;">${s.text}</div>
        </div>
      `).join("")}
    </div>
  `;
}

/* ---------------- HOME / JOB LIST ---------------- */
let allJobs = [];
async function viewHome(){
  setApp(`
    <div class="hero">
      <div class="hero-imgs">
        ${HERO_IMAGES.map((src,i)=>`<img src="${src}" class="hero-bg" style="animation-delay:${i*6}s" onerror="this.style.display='none'">`).join("")}
        <div class="hero-overlay"></div>
        <div class="container hero-content">
          <div class="eyebrow">Karriereplattform · Apotheken Schweiz</div>
          <div class="hero-title">Gesundheit braucht die richtigen Menschen.</div>
          <div class="hero-sub">Finde die passende Stelle in einer Schweizer Apotheke — oder das passende Fachpersonal für dein Team.</div>
          <div class="stat-row">
            <div class="stat"><b id="stat-jobs">–</b><span>offene Stellen</span></div>
            <div class="stat"><b>26</b><span>Kantone</span></div>
            <div class="stat"><b>100%</b><span>kostenlos für Bewerbende</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="searchbar">
        <input id="q-search" placeholder="Titel, Betrieb oder Ort suchen…" style="flex:2;min-width:200px;" oninput="filterJobs()">
        <select id="q-canton" style="flex:1;min-width:140px;" onchange="filterJobs()">
          <option value="all">Alle Kantone</option>${cantonOptions()}
        </select>
        <select id="q-profession" style="flex:1;min-width:160px;" onchange="filterJobs()">
          <option value="all">Alle Rollen</option>
          ${PROFESSIONS.map(p=>`<option value="${p.key}">${p.label}</option>`).join("")}
        </select>
      </div>

      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:40px;">
        <div class="split-card">
          <div style="font-size:13px;color:var(--text2);font-weight:600;">Ich suche</div>
          <div style="font-size:26px;font-weight:800;margin-bottom:18px;letter-spacing:-0.02em;">einen Job</div>
          <a href="#/" class="btn-primary" style="margin-right:10px;">Offene Stellen</a>
          <a href="#/profile" class="btn-ghost">Profil erstellen</a>
        </div>
        <div class="split-card">
          <div style="font-size:13px;color:var(--text2);font-weight:600;">Ich suche</div>
          <div style="font-size:26px;font-weight:800;margin-bottom:18px;letter-spacing:-0.02em;">Personal</div>
          <a href="#/post-job" class="btn-primary" style="margin-right:10px;">Inserat aufgeben</a>
          <a href="#/pricing" class="btn-ghost">Zugang &amp; Preise</a>
        </div>
      </div>

      <h2 class="section-title">Stellen nach Kanton</h2>
      <div class="section-underline"></div>
      <div id="canton-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:40px;">Lade…</div>

      ${adBanner()}

      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;margin-top:36px;">
        <h2 class="section-title" style="margin-bottom:0;">Neuste Stelleninserate</h2>
        <span id="job-count" style="font-size:13px;color:var(--text2);font-weight:600;"></span>
      </div>
      <div class="section-underline"></div>
      <div id="job-list">Lade Stellen…</div>

      ${servicesBlock()}
      ${newsletterBlock()}
    </div>
  `);
  const { data } = await sb.from("jobs")
    .select("id,title,profession,canton,place,employment_type,is_springer,springer_duration,status,companies(name,verified)")
    .eq("status","published")
    .order("created_at",{ascending:false});
  allJobs = data || [];
  const statEl = document.getElementById("stat-jobs");
  if (statEl) statEl.textContent = allJobs.length;
  renderCantonGrid();
  filterJobs();
}
function renderCantonGrid(){
  const grid = document.getElementById("canton-grid");
  if (!grid) return;
  const counts = {};
  allJobs.forEach(j => { counts[j.canton] = (counts[j.canton]||0) + 1; });
  const top = [...CANTONS].sort((a,b) => (counts[b.code]||0) - (counts[a.code]||0)).slice(0,12);
  grid.innerHTML = top.map(c => `
    <a href="#/?canton=${c.code}" onclick="setTimeout(()=>{document.getElementById('q-canton').value='${c.code}';filterJobs();},50)">
      <div class="canton-chip"><span>${c.name} <span style="color:var(--text2);font-size:11.5px;">(${c.code})</span></span><b>${counts[c.code]||0}</b></div>
    </a>
  `).join("");
}
function filterJobs(){
  const q = (document.getElementById("q-search")?.value || "").toLowerCase();
  const canton = document.getElementById("q-canton")?.value || "all";
  const prof = document.getElementById("q-profession")?.value || "all";
  const filtered = allJobs.filter(j => {
    const matchQ = !q || `${j.title} ${j.companies?.name||""} ${j.place||""}`.toLowerCase().includes(q);
    const matchC = canton==="all" || j.canton===canton;
    const matchP = prof==="all" || j.profession===prof;
    return matchQ && matchC && matchP;
  });
  const list = document.getElementById("job-list");
  const countEl = document.getElementById("job-count");
  if (!list) return;
  if (countEl) countEl.textContent = `${filtered.length} ${filtered.length===1?"Stelle":"Stellen"}`;
  if (filtered.length === 0) {
    list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);border-style:dashed;padding:44px;">
      <div style="font-size:28px;margin-bottom:10px;">🔍</div>
      Keine Stellen gefunden. Sobald Arbeitgeber Inserate veröffentlichen, erscheinen sie hier.
    </div>`;
    return;
  }
  list.innerHTML = filtered.map(j => jobCardHtml(j)).join("");
}
function jobCardHtml(j){
  return `
    <a href="#/job/${j.id}">
      <div class="job-card">
        <div style="display:flex;gap:16px;align-items:center;">
          <div class="job-icon">${profIcon(j.profession)}</div>
          <div>
            <div style="font-size:17px;font-weight:700;margin-bottom:3px;">${esc(j.title)}</div>
            <div style="font-size:13.5px;color:var(--text2);">${esc(j.companies?.name||"")} · 📍 ${esc(j.place||"")} (${esc(j.canton||"")})</div>

              <span class="tag">${profLabel(j.profession)}</span>
              <span class="tag">${j.is_springer ? `Springer · ${esc(j.springer_duration||"")}` : esc(j.employment_type||"")}</span>

async function saveCompany(existingId){
  const statusEl = document.getElementById("c-status");
  statusEl.className="msg"; statusEl.textContent="Speichert…";
  let photo_urls;
  const files = document.getElementById("c-photos").files;
  if (files && files.length) {
    const { data: existing } = await sb.from("companies").select("photo_urls").eq("owner_id", currentSession.user.id).maybeSingle();
    photo_urls = existing?.photo_urls || [];
    for (const file of files) {
      const path = `${currentSession.user.id}/${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from("company-photos").upload(path, file, { upsert: true });
      if (!upErr) {
        const { data: pub } = sb.storage.from("company-photos").getPublicUrl(path);
        photo_urls.push(pub.publicUrl);
      }
    }
  }
  const payload = {
    owner_id: currentSession.user.id,
    name: document.getElementById("c-name").value,
    place: document.getElementById("c-place").value,
    canton: document.getElementById("c-canton").value,
    phone: document.getElementById("c-phone").value,
    email: document.getElementById("c-email").value,
    description: document.getElementById("c-desc").value,
  };
  if (photo_urls) payload.photo_urls = photo_urls;
  if (existingId) payload.id = existingId;
  const { error } = await sb.from("companies").upsert(payload, existingId ? { onConflict: "id" } : undefined);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  location.hash = "#/post-job";
}

        <p style="font-size:14px;margin-bottom:18px;color:var(--text2);line-height:1.6;">Bevor du eine Stelle veröffentlichst, richte kurz dein Firmenprofil ein.</p>
        <a href="#/company" class="btn-primary" style="width:100%;text-align:center;">Firmenprofil erstellen</a>
    `));
    return;
  }
  setApp(authShell("Stelle erstellen", `
      <p style="font-size:13px;color:var(--text2);margin-bottom:20px;">✓ Deine Stelle ist sofort nach dem Absenden auf der Startseite sichtbar.</p>
      <div class="field">Stellentitel<input id="j-title" placeholder="z. B. Pharma-Assistent:in 80%"></div>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">Rolle
          <select id="j-profession">${PROFESSIONS.map(p=>`<option value="${p.key}">${p.label}</option>`).join("")}</select>
        </div>
        <div class="field" style="width:160px;">Kanton<select id="j-canton">${cantonOptions("ZH")}</select></div>
      </div>
      <div class="field">Ort<input id="j-place"></div>
      <div class="field">Anstellungsart
        <select id="j-type"><option>Festanstellung</option><option>Teilzeit</option><option>Praktikum</option></select>
      </div>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
        <input type="checkbox" id="j-springer" style="width:auto;"> Kurzfristige Ferienvertretung (Springer)
      </div>
      <div class="field" id="j-springer-dur-wrap" style="display:none;">Dauer / Zeitraum<input id="j-springer-dur" placeholder="z. B. 2 Wochen, August"></div>
      <div class="field">Beschreibung<textarea id="j-desc" rows="5" placeholder="Aufgaben, Anforderungen, was ihr bietet…"></textarea></div>
      <div id="j-status"></div>
      <button class="btn-primary" style="width:100%;" onclick="submitJob('${comp.id}')">Stelle veröffentlichen</button>
  `, 560));
  document.getElementById("j-springer").addEventListener("change", (e) => {
    document.getElementById("j-springer-dur-wrap").style.display = e.target.checked ? "flex" : "none";
  });
}
async function submitJob(companyId){
  const statusEl = document.getElementById("j-status");
  const payload = {
    company_id: companyId,
    title: document.getElementById("j-title").value,
    profession: document.getElementById("j-profession").value,
    canton: document.getElementById("j-canton").value,
    place: document.getElementById("j-place").value,
    employment_type: document.getElementById("j-type").value,
    description: document.getElementById("j-desc").value,
    is_springer: document.getElementById("j-springer").checked,
    springer_duration: document.getElementById("j-springer-dur").value,
    status: "published",
  };
  if (!payload.title || !payload.place) { statusEl.className="msg error"; statusEl.textContent = "Titel und Ort ausfüllen."; return; }
  const { error } = await sb.from("jobs").insert(payload);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  statusEl.className="msg ok"; statusEl.textContent = "✓ Veröffentlicht! Du wirst weitergeleitet…";
  setTimeout(() => location.hash = "#/", 900);
}

/* ---------------- PRICING ---------------- */

    {key:"premium", name:"Pro", price:690, period:"Laufzeit: 1 Jahr", features:["Bis zu 5 Inserate","Hervorgehobenes Listing","Chat mit Bewerbenden"], highlight:true},

    ["Aktive Inserate","1","5","Unbegrenzt"],

            <div style="font-size:20px;font-weight:800;margin-bottom:18px;text-align:center;">${t.name}</div>
            <div style="text-align:center;"><span style="font-size:14px;font-weight:700;color:var(--text2);">CHF </span><span style="font-size:38px;font-weight:800;letter-spacing:-0.02em;">${t.price}</span></div>

            <a href="#/post-job" class="btn-primary" style="width:100%;text-align:center;display:block;margin-bottom:26px;">Auswählen</a>
            <div style="border-top:1px solid ${t.highlight?'#BFE8C9':'var(--line)'};padding-top:20px;display:flex;flex-direction:column;gap:13px;font-size:14px;flex:1;">
              ${t.features.map(f=>`<div style="display:flex;gap:10px;align-items:flex-start;"><span style="color:var(--amber);font-weight:700;">✓</span>${f}</div>`).join("")}
            </div>

        `).join("")}

      <h2 class="section-title">Pakete im Vergleich</h2>
      <div class="section-underline"></div>
      <div class="panel" style="overflow-x:auto;margin-bottom:50px;">
        <table class="compare-table">

          <tbody>
            ${compareRows.map(r=>`<tr><td style="font-weight:600;">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>

      <h2 class="section-title">Häufige Fragen</h2>
      <div class="section-underline"></div>
      <div class="panel">
        ${faqs.map((f,i)=>`
          <div class="faq-item" id="faq-${i}">
            <div class="faq-q" onclick="document.getElementById('faq-${i}').classList.toggle('open')">${f[0]} <span>+</span></div>
            <div class="faq-a">${f[1]}</div>

/* ---------------- FAVORITES ---------------- */
async function viewFavorites(){
  if (!currentSession) { setApp(authShell("Favoriten", `<p style="margin-bottom:18px;color:var(--text2);font-size:14px;">Melde dich an, um Favoriten zu sehen.</p><a href="#/login" class="btn-primary" style="width:100%;text-align:center;">Zum Login</a>`)); return; }
  setApp(`<div class="container" style="padding:40px 32px 80px;"><h1 style="font-size:26px;margin-bottom:22px;">Favoriten</h1><div id="fav-list">Lade…</div></div>`);
  const { data } = await sb.from("favorites").select("job_id, jobs(id,title,place,canton,profession,companies(name,verified))").eq("candidate_id", currentSession.user.id);
  const list = document.getElementById("fav-list");
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Favoriten gespeichert.</div>`; return; }
  list.innerHTML = data.filter(f=>f.jobs).map(f => jobCardHtml(f.jobs)).join("");
}

/* ---------------- MY APPLICATIONS ---------------- */
async function viewMyApplications(){
  if (!currentSession) { setApp(authShell("Meine Bewerbungen", `<p style="margin-bottom:18px;color:var(--text2);font-size:14px;">Melde dich an, um deine Bewerbungen zu sehen.</p><a href="#/login" class="btn-primary" style="width:100%;text-align:center;">Zum Login</a>`)); return; }
  setApp(`<div class="container" style="padding:40px 32px 80px;"><h1 style="font-size:26px;margin-bottom:22px;">Meine Bewerbungen</h1><div id="app-list">Lade…</div></div>`);
  const { data } = await sb.from("applications").select("*, jobs(title,place,canton,companies(name))").eq("candidate_id", currentSession.user.id).order("created_at",{ascending:false});
  const list = document.getElementById("app-list");
  const labels = {new:"Neu",review:"In Prüfung",interview:"Interview",rejected:"Abgelehnt",hired:"Eingestellt"};
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Bewerbungen gesendet.</div>`; return; }
  list.innerHTML = data.map(a => `
    <div class="job-card">
      <div><div style="font-weight:700;">${esc(a.jobs?.title||"")}</div><div style="font-size:13px;color:var(--text2);">${esc(a.jobs?.companies?.name||"")} · ${esc(a.jobs?.place||"")} (${esc(a.jobs?.canton||"")})</div></div>
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="tag accent">${labels[a.status]||a.status}</span>
        <a href="#/chat/${a.id}" class="btn-ghost" style="padding:8px 14px;font-size:13px;">💬 Chat</a>
      </div>
    </div>
  `).join("");
}

/* ---------------- EMPLOYER DASHBOARD ---------------- */
async function viewEmployerDashboard(){
  if (!currentSession) { location.hash = "#/login"; return; }
  const { data: comp } = await sb.from("companies").select("*").eq("owner_id", currentSession.user.id).maybeSingle();
  if (!comp) { location.hash = "#/company"; return; }
  const { data: jobs } = await sb.from("jobs").select("*").eq("company_id", comp.id).order("created_at",{ascending:false});
  setApp(`
    <div class="container" style="padding:40px 32px 80px;">
      <h1 style="font-size:26px;margin-bottom:6px;">${esc(comp.name)}</h1>
      <div style="font-size:14px;color:var(--text2);margin-bottom:26px;">📍 ${esc(comp.place||"")} (${esc(comp.canton||"")})</div>
      <div style="display:flex;gap:10px;margin-bottom:26px;">
        <a href="#/post-job" class="btn-primary">+ Stelle erstellen</a>
        <a href="#/company" class="btn-ghost">Firmenprofil bearbeiten</a>
      </div>
      <div>
        ${(jobs||[]).map(j => `
          <div class="job-card">
            <div>
              <div style="font-weight:700;">${esc(j.title)}</div>
              <div style="font-size:13px;color:var(--text2);">Status: ${j.status==="published"?"✓ Veröffentlicht":j.status==="pending"?"⏳ Wartet auf Freischaltung":"Geschlossen"}</div>
            </div>
          </div>
        `).join("") || `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Inserate.</div>`}
      </div>
    </div>
  `);
}

/* ---------------- ADMIN ---------------- */
async function viewAdmin(){
  if (!currentProfile || currentProfile.role !== "admin") { setApp(`<div class="container" style="padding:40px 32px;"><div class="panel">Kein Zugriff.</div></div>`); return; }
  setApp(`<div class="container" style="padding:40px 32px 80px;"><h1 style="font-size:26px;margin-bottom:22px;">Admin — Inserate freischalten</h1><div id="admin-list">Lade…</div></div>`);
  const { data } = await sb.from("jobs").select("*, companies(name)").eq("status","pending").order("created_at",{ascending:false});
  const list = document.getElementById("admin-list");
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Keine Inserate zur Prüfung.</div>`; return; }
  list.innerHTML = data.map(j => `
    <div class="job-card">
      <div><div style="font-weight:700;">${esc(j.title)}</div><div style="font-size:13px;color:var(--text2);">${esc(j.companies?.name||"")} · ${esc(j.place||"")} (${esc(j.canton||"")})</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" style="padding:9px 18px;font-size:13px;" onclick="publishJob('${j.id}')">Freischalten</button>
        <button class="btn-ghost" style="padding:9px 18px;font-size:13px;" onclick="rejectJob('${j.id}')">Ablehnen</button>
      </div>
    </div>
  `).join("");
}
async function publishJob(id){ await sb.from("jobs").update({status:"published"}).eq("id",id); viewAdmin(); }
async function rejectJob(id){ await sb.from("jobs").update({status:"closed"}).eq("id",id); viewAdmin(); }

/* ---------------- ROUTER ---------------- */
async function router(){
  renderNav();
  const hash = (location.hash || "#/").split("?")[0];
  const jobMatch = hash.match(/^#\/job\/(.+)$/);
  const chatMatch = hash.match(/^#\/chat\/(.+)$/);
  window.scrollTo(0,0);
  if (hash === "#/" || hash === "") await viewHome();
  else if (jobMatch) await viewJobDetail(jobMatch[1]);
  else if (chatMatch) await viewChat(chatMatch[1]);
  else if (hash === "#/springer") await viewSpringer();
  else if (hash === "#/cantons") await viewCantons();
  else if (hash === "#/register") viewRegister();
  else if (hash === "#/login") viewLogin();
  else if (hash === "#/profile") await viewProfile();
  else if (hash === "#/company") await viewCompany();
  else if (hash === "#/post-job") await viewPostJob();
  else if (hash === "#/pricing") viewPricing();
  else if (hash === "#/favorites") await viewFavorites();
  else if (hash === "#/my-applications") await viewMyApplications();
  else if (hash === "#/employer-dashboard") await viewEmployerDashboard();
  else if (hash === "#/admin") await viewAdmin();
  else setApp(`<div class="container" style="padding:40px 32px;"><div class="panel">Seite nicht gefunden. <a href="#/">Zurück zur Startseite</a></div></div>`);
}

window.addEventListener("hashchange", router);
(async function init(){
  await refreshSession();
  router();
})();
</script>
