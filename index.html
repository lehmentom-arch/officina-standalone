<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officina.ch — Karriereplattform für Apotheken</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --pine:#0E2B2E; --paper:#FFFFFF; --panel:#F5FAFA; --panel-highlight:#E1F5F3;
  --amber:#0F8B8B; --amber-dark:#0B6E6E; --line:#E2E9E8; --text2:#5C6B6A; --danger:#DC2626;
  --shadow-sm:0 1px 2px rgba(14,43,46,0.05), 0 1px 3px rgba(14,43,46,0.07);
  --shadow-md:0 4px 14px rgba(14,43,46,0.09), 0 2px 6px rgba(14,43,46,0.06);
  --shadow-lg:0 20px 40px rgba(10,30,32,0.16);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:#1A1D1A;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:800;margin:0;letter-spacing:-0.025em;}
a{color:#1A1D1A;text-decoration:none;cursor:pointer;}
input,select,textarea{padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;width:100%;transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(46,158,63,0.15);}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
.btn-primary{background:var(--amber);color:#fff;border:none;border-radius:9px;padding:13px 24px;font-size:14.5px;font-weight:700;display:inline-block;box-shadow:0 2px 8px rgba(46,158,63,0.28);transition:background .15s, transform .1s;}
.btn-primary:hover{background:var(--amber-dark);transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.55;box-shadow:none;transform:none;}
.btn-ghost{background:#fff;color:#1A1D1A;border:1px solid var(--line);border-radius:9px;padding:12px 22px;font-size:14.5px;font-weight:600;display:inline-block;transition:border-color .15s, background .15s;}
.btn-ghost:hover{border-color:#1A1D1A;background:var(--panel);}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-sm);}
.tag{font-size:11.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:#3F453F;display:inline-flex;align-items:center;gap:5px;font-weight:600;background:#fafafa;}
.tag.accent{border-color:#BFE8C9;color:var(--amber-dark);background:var(--panel-highlight);}
.container{max-width:1100px;margin:0 auto;padding:0 32px;}
.field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:16px;}
header.topbar{background:var(--pine);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,0.06);}
header.topbar .row{padding:13px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1100px;margin:0 auto;}
header.topbar a.logo{font-weight:800;font-size:18px;color:#fff;flex-shrink:0;letter-spacing:-0.02em;}
header.topbar a.logo span{color:var(--amber);}
nav.navlinks{display:flex;gap:18px;flex:1;margin-left:26px;flex-wrap:wrap;}
nav.navlinks a{color:rgba(255,255,255,0.82);font-size:13.5px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s;white-space:nowrap;}
nav.navlinks a:hover{color:#fff;}
nav.navlinks a.active{color:var(--amber);border-bottom:2px solid var(--amber);}
.navright{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.job-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px 26px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:14px;transition:box-shadow .2s, transform .2s, border-color .2s;}
.job-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px) scale(1.012);border-color:#cfe4d3;z-index:2;position:relative;}
.job-icon{width:48px;height:48px;border-radius:12px;background:var(--panel-highlight);color:var(--amber-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
#app{min-height:60vh;}
.msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:8px;}
.msg.error{color:#991B1B;background:#FEF2F2;border:1px solid #FECACA;}
.msg.ok{color:var(--amber-dark);background:var(--panel-highlight);border:1px solid #BFE8C9;}
.hero{position:relative;overflow:hidden;}
.hero-imgs{position:relative;min-height:480px;display:flex;align-items:center;}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:hfade 24s infinite;filter:brightness(1.12) saturate(1.08) contrast(1.02);}
@keyframes hfade{0%{opacity:0;}4%{opacity:1;}20%{opacity:1;}24%{opacity:0;}100%{opacity:0;}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,20,15,0.18) 0%, rgba(15,20,15,0.42) 60%, rgba(15,20,15,0.78) 100%);}
.hero-content{position:relative;padding:90px 32px 90px;text-align:center;}
.eyebrow{font-size:13px;color:var(--amber);font-weight:700;letter-spacing:0.09em;text-transform:uppercase;margin-bottom:16px;}
.hero-title{font-size:clamp(30px,5vw,52px);line-height:1.06;color:#fff;font-weight:800;letter-spacing:-0.03em;text-shadow:0 2px 24px rgba(0,0,0,0.35);max-width:780px;margin:0 auto;}
.hero-sub{color:rgba(255,255,255,0.88);font-size:16px;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto;}
.stat-row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.stat{color:#fff;text-align:center;}
.stat b{display:block;font-size:22px;font-weight:800;}
.stat span{font-size:12.5px;opacity:0.8;}
.searchbar{position:relative;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;margin:-18px auto 40px;max-width:820px;display:flex;gap:10px;flex-wrap:wrap;border:1px solid var(--line);}
.auth-wrap{display:flex;justify-content:center;padding:20px 0 40px;}
.pricing-card{flex:1 1 260px;border-radius:18px;padding:30px;position:relative;transition:transform .15s;}
.pricing-card:hover{transform:translateY(-3px);}
.split-card{flex:1 1 320px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow-sm);}
.section-title{font-size:24px;margin-bottom:6px;}
.section-underline{width:46px;height:3px;background:var(--amber);border-radius:2px;margin-bottom:24px;}
.canton-chip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;transition:border-color .15s, box-shadow .15s;}
.canton-chip:hover{border-color:var(--amber);box-shadow:var(--shadow-sm);}
.canton-chip b{color:var(--amber-dark);}
.service-card{flex:1 1 220px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;}
.service-icon{font-size:26px;margin-bottom:10px;}
.ad-banner{background:linear-gradient(135deg,#EAF7EC,#F7F8F6);border:1px dashed #BFE8C9;border-radius:16px;padding:26px;text-align:center;margin:30px 0;}
.newsletter-box{background:var(--amber);border-radius:18px;padding:32px;color:#fff;}
.newsletter-box input[type=email]{border:none;padding:13px;border-radius:9px;}
.site-footer{background:var(--pine);color:#fff;margin-top:50px;padding:44px 32px 26px;}
.footer-cols{display:flex;gap:40px;flex-wrap:wrap;max-width:1100px;margin:0 auto 30px;}
.footer-col h4{font-size:13px;color:#fff;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;}
.footer-col a{display:block;color:rgba(255,255,255,0.75);font-size:13.5px;margin-bottom:9px;}
.footer-col a:hover{color:var(--amber);}
.social-row{display:flex;gap:14px;max-width:1100px;margin:0 auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12);}
.social-row a{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:15px;}
.faq-item{border-bottom:1px solid var(--line);padding:16px 0;}
.faq-q{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;cursor:pointer;}
.faq-a{font-size:13.5px;color:var(--text2);margin-top:10px;line-height:1.6;display:none;}
.faq-item.open .faq-a{display:block;}
.compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.compare-table th,.compare-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center;}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;}
.compare-table th{font-size:13px;color:var(--text2);}

/* ---- Canton Wappen badge ---- */
.canton-badge{width:26px;height:30px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.18));}
.canton-badge svg{width:100%;height:100%;}
.canton-badge.lg{width:40px;height:46px;}
.canton-badge.sm{width:18px;height:21px;}
.canton-chip{gap:10px;}
.canton-chip .cc-left{display:flex;align-items:center;gap:10px;}

/* ---- Job card colour system ---- */
.job-card{border-left:5px solid var(--card-accent, var(--amber));position:relative;overflow:hidden;}
.job-card.springer{background:linear-gradient(90deg, rgba(46,158,63,0.05), #fff 14%);}
.job-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow-sm);}
.job-card .job-icon{position:relative;}

/* ---- Nav dropdown ---- */
.nav-item{position:relative;}
.nav-item>a{display:flex;align-items:center;gap:4px;}
.nav-caret{font-size:9px;opacity:0.7;transform:translateY(1px);}
.nav-dropdown{display:none;position:absolute;top:100%;left:0;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:250px;padding:10px;z-index:40;}
.nav-item:hover .nav-dropdown{display:block;}
.nav-item:hover>a{color:#fff;}
.nav-dropdown a{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;color:#1A1D1A !important;border:none !important;}
.nav-dropdown a:hover{background:var(--panel-highlight);}
.nav-dropdown .nd-icon{font-size:16px;width:22px;flex-shrink:0;}
.nav-dropdown .nd-title{font-size:13.5px;font-weight:700;}
.nav-dropdown .nd-sub{font-size:11.5px;color:var(--text2);font-weight:500;margin-top:1px;}

/* ---- About page ---- */
.about-stat{flex:1 1 150px;text-align:center;padding:22px 10px;}
.about-stat b{display:block;font-size:30px;font-weight:800;color:var(--amber-dark);}
.about-stat span{font-size:12.5px;color:var(--text2);}
.value-card{flex:1 1 240px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:22px;}
.timeline-row{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);}
.timeline-row b{color:var(--amber-dark);min-width:70px;flex-shrink:0;}

/* ---- Springer filter/upload extras ---- */
.upload-drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:12.5px;color:var(--text2);background:var(--panel);}
.img-thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.img-thumb-row img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}

@media (max-width:760px){ nav.navlinks{display:none;} .searchbar{flex-direction:column;} .footer-cols{gap:26px;} .nav-dropdown{position:static;box-shadow:none;margin-top:6px;} }
</style>
</head>
<body>

<script>
const SUPABASE_URL = "https://zeliherrtisicijdgvuh.supabase.co";
const SUPABASE_KEY = "sb_publishable_zrNIQFWU7WOXC-w72kRBFA_Bzkn8505";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const HERO_IMAGES = [
  "https://images.unsplash.com/photo-1642055514517-7b52288890ec?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1576602976047-174e57a47881?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1580281657527-47f249e8f4df?auto=format&fit=crop&w=2000&q=75",
  "https://images.unsplash.com/photo-1622230208995-0f26eba75875?auto=format&fit=crop&w=2000&q=75",
];

const CANTONS = [
  {code:"ZH",name:"Zürich"},{code:"BE",name:"Bern"},{code:"LU",name:"Luzern"},{code:"UR",name:"Uri"},
  {code:"SZ",name:"Schwyz"},{code:"OW",name:"Obwalden"},{code:"NW",name:"Nidwalden"},{code:"GL",name:"Glarus"},
  {code:"ZG",name:"Zug"},{code:"FR",name:"Freiburg"},{code:"SO",name:"Solothurn"},{code:"BS",name:"Basel-Stadt"},
  {code:"BL",name:"Basel-Landschaft"},{code:"SH",name:"Schaffhausen"},{code:"AR",name:"Appenzell Ausserrhoden"},
  {code:"AI",name:"Appenzell Innerrhoden"},{code:"SG",name:"St. Gallen"},{code:"GR",name:"Graubünden"},
  {code:"AG",name:"Aargau"},{code:"TG",name:"Thurgau"},{code:"TI",name:"Tessin"},{code:"VD",name:"Waadt"},
  {code:"VS",name:"Wallis"},{code:"NE",name:"Neuenburg"},{code:"GE",name:"Genf"},{code:"JU",name:"Jura"},
];
const PROFESSIONS = [
  {key:"apotheker",label:"Apotheker:in",icon:"⚕",color:"#0F8B8B"},
  {key:"pharma_assistent",label:"Pharma-Assistent:in",icon:"✚",color:"#3457D5"},
  {key:"praktikum",label:"Praktikum",icon:"🎓",color:"#C08A1E"},
];
function profLabel(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.label : k; }
function profIcon(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.icon : "⚕"; }
function profColor(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.color : "var(--amber)"; }

/* Wappenfarben je Kanton (vereinfachte, stilisierte Darstellung der Kantonsfarben) */
const CANTON_COLORS = {
  ZH:["#0038A8","#FFFFFF"], BE:["#D52B1E","#000000"], LU:["#1A69C4","#FFFFFF"], UR:["#FFD100","#111111"],
  SZ:["#D71920","#FFFFFF"], OW:["#D71920","#FFFFFF"], NW:["#D71920","#FFFFFF"], GL:["#D71920","#111111"],
  ZG:["#0038A8","#FFFFFF"], FR:["#000000","#FFFFFF"], SO:["#D71920","#FFFFFF"], BS:["#000000","#FFFFFF"],
  BL:["#D71920","#FFFFFF"], SH:["#FFD100","#111111"], AR:["#000000","#FFFFFF"], AI:["#111111","#FFD100"],
  SG:["#1B7A3D","#FFFFFF"], GR:["#111111","#1A69C4"], AG:["#0038A8","#111111"], TG:["#1B7A3D","#FFD100"],
  TI:["#D71920","#0038A8"], VD:["#1B7A3D","#FFFFFF"], VS:["#D71920","#FFFFFF"], NE:["#1B7A3D","#D71920"],
  GE:["#D71920","#FFD100"], JU:["#D71920","#FFFFFF"],
};
function cantonBadge(code, size){
  const cols = CANTON_COLORS[code] || ["#3F453F","#FFFFFF"];
  const cls = size ? ` ${size}` : "";
  return `<span class="canton-badge${cls}" title="${code}">
    <svg viewBox="0 0 26 30"><path d="M13 0 L26 5 V16 C26 24 20 28 13 30 C6 28 0 24 0 16 V5 Z" fill="${cols[0]}"/>
    <path d="M13 0 L26 5 V16 C26 24 20 28 13 30 Z" fill="${cols[1]}" opacity="0.16"/>
    <text x="13" y="17.5" text-anchor="middle" font-size="10" font-weight="800" fill="${cols[1]}" font-family="Inter,sans-serif">${code}</text>
    </svg>
  </span>`;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function jobImgFallback(img){ img.style.display="none"; if (img.nextElementSibling) img.nextElementSibling.style.display="flex"; }
function cantonOptions(selected){
  return CANTONS.map(c => `<option value="${c.code}" ${c.code===selected?"selected":""}>${c.name}</option>`).join("");
}

let currentSession = null;
let currentProfile = null;

async function refreshSession(){
  const { data } = await sb.auth.getSession();
  currentSession = data.session;
  if (currentSession) {
    const { data: prof } = await sb.from("profiles").select("*").eq("id", currentSession.user.id).single();
    currentProfile = prof;
  } else {
    currentProfile = null;
  }
  renderNav();
}

function renderNav(){
  const hash = (location.hash || "#/").split("?")[0];
  const dropdown = `
    <div class="nav-item">
      <a class="${hash==='#/springer'?'active':''}">Dienstleistungen <span class="nav-caret">▾</span></a>
      <div class="nav-dropdown">
        <a href="#/jobs"><span class="nd-icon">💊</span><span><span class="nd-title">Stelleninserate</span><span class="nd-sub" style="display:block;">Feste Stellen &amp; Praktika in Apotheken</span></span></a>
        <a href="#/springer"><span class="nd-icon">🏖️</span><span><span class="nd-title">Springer &amp; Ferien-Aushilfe</span><span class="nd-sub" style="display:block;">Kurzfristige Einsätze mit Tagen &amp; Lohn</span></span></a>
        <a href="#/cantons"><span class="nd-icon">🗺️</span><span><span class="nd-title">Alle Kantone</span><span class="nd-sub" style="display:block;">Stellen nach Kanton entdecken</span></span></a>
        <a href="#/company"><span class="nd-icon">🏢</span><span><span class="nd-title">Firmenprofil</span><span class="nd-sub" style="display:block;">Apotheke &amp; Team präsentieren</span></span></a>
        <a href="#/pricing"><span class="nd-icon">💰</span><span><span class="nd-title">Preise für Arbeitgeber</span><span class="nd-sub" style="display:block;">Pakete &amp; Konditionen</span></span></a>
      </div>
    </div>
  `;
  const links = [
    ["#/", "Start"],
    ["#/jobs", "Alle Stellen"],
    ["#/profile", "Profil erstellen"],
    ["#/about", "Über uns"],
  ];
  if (currentProfile && currentProfile.role === "candidate") {
    links.push(["#/favorites", "Favoriten"]);
    links.push(["#/my-applications", "Bewerbungen"]);
  }
  if (currentProfile && currentProfile.role === "employer") {
    links.push(["#/employer-dashboard", "Dashboard"]);
  }
  if (currentProfile && currentProfile.role === "admin") {
    links.push(["#/admin", "Admin"]);
  }
  document.getElementById("navlinks").innerHTML = dropdown + links.map(([href,label]) =>
    `<a href="${href}" class="${hash===href?'active':''}">${label}</a>`
  ).join("");

  const right = document.getElementById("navright");
  if (currentSession) {
    right.innerHTML = `<button class="btn-primary" style="padding:9px 18px;font-size:13.5px;box-shadow:none;" onclick="logout()">Abmelden</button>`;
  } else {
    right.innerHTML = `<a href="#/login" class="btn-ghost" style="padding:9px 16px;font-size:13.5px;background:transparent;border-color:rgba(255,255,255,0.35);color:#fff;">Login</a>
    <a href="#/register" class="btn-primary" style="padding:9px 18px;font-size:13.5px;">Registrieren</a>`;
  }
}

async function logout(){
  await sb.auth.signOut();
  await refreshSession();
  location.hash = "#/";
}

function setApp(html){ document.getElementById("app").innerHTML = html; }

function newsletterBlock(){
  return `
    <div class="newsletter-box" style="margin:36px 0;">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px;">Newsletter — 10% auf dein erstes Inserat</div>

function filterJobs(){
  const q = (document.getElementById("q-search")?.value || "").toLowerCase();
  const canton = document.getElementById("q-canton")?.value || "all";
  const prof = document.getElementById("q-profession")?.value || "all";
  const pensum = document.getElementById("q-pensum")?.value || "all";
  const filtered = allJobs.filter(j => {
    const matchQ = !q || `${j.title} ${j.companies?.name||""} ${j.place||""}`.toLowerCase().includes(q);
    const matchC = canton==="all" || j.canton===canton;
    const matchP = prof==="all" || j.profession===prof;
    const matchPensum = pensum==="all" || j.pensum===pensum;
    return matchQ && matchC && matchP && matchPensum;
  });
  const list = document.getElementById("job-list");
  const countEl = document.getElementById("job-count");
  if (!list) return;
  if (countEl) countEl.textContent = `${filtered.length} ${filtered.length===1?"Stelle":"Stellen"}`;
  if (filtered.length === 0) {
    list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);border-style:dashed;padding:44px;">
      <div style="font-size:28px;margin-bottom:10px;">🔍</div>
      Keine Stellen gefunden. Sobald Arbeitgeber Inserate veröffentlichen, erscheinen sie hier.
    </div>`;
    return;
  }
  list.innerHTML = filtered.map(j => jobCardHtml(j)).join("");
}
function jobCardHtml(j){

  const thumb = j.image_url
    ? `<img src="${esc(j.image_url)}" class="job-thumb" onerror="jobImgFallback(this)"><div class="job-icon" style="color:${accent};background:${accent}15;display:none;">${profIcon(j.profession)}</div>`
    : `<div class="job-icon" style="color:${accent};background:${accent}15;">${profIcon(j.profession)}</div>`;
  return `
    <a href="#/job/${j.id}">
      <div class="job-card ${j.is_springer?'springer':''}" style="--card-accent:${accent};">
        <div style="display:flex;gap:16px;align-items:center;">
          ${thumb}
          <div>

              <span class="tag">${profLabel(j.profession)}</span>
              ${j.pensum ? `<span class="tag">${esc(j.pensum)}</span>` : ''}

              ${j.springer_wage ? `<span class="tag accent">💰 ${esc(j.springer_wage)}</span>` : ''}
              ${j.companies?.verified ? '<span class="tag accent">✓ verifiziert</span>' : ''}
            </div>
          </div>
        </div>
        <span style="color:${accent};font-weight:700;font-size:22px;">→</span>
      </div>

  `;
}

  const mapQuery = encodeURIComponent(`${comp.name||""} ${job.place||""} Schweiz`);
  const photos = comp.photo_urls || [];

    <div class="container" style="padding:40px 32px 80px;">

          <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:6px;">
            <div class="job-icon" style="width:52px;height:52px;font-size:22px;color:${job.is_springer?'#8A4FD1':profColor(job.profession)};background:${job.is_springer?'#8A4FD115':profColor(job.profession)+'15'};">${profIcon(job.profession)}</div>
            <div>
              <h1 style="font-size:27px;margin-bottom:6px;">${esc(job.title)}</h1>
              <div style="font-size:15px;color:#31463D;display:flex;align-items:center;gap:7px;">${esc(comp.name||"")} · ${cantonBadge(job.canton)} ${esc(job.place||"")} (${esc(job.canton||"")})</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap;">
            <span class="tag">${esc(job.employment_type||"")}</span>
            ${job.pensum ? `<span class="tag">${esc(job.pensum)}</span>` : ""}
            ${job.is_springer ? `<span class="tag" style="border-color:#D9C2F0;color:#6B3AAE;background:#F6F0FC;">🏖️ Ferien-Aushilfe${job.springer_duration?` · ${esc(job.springer_duration)}`:''}</span>` : ""}
            ${job.is_springer && job.springer_days ? `<span class="tag" style="border-color:#D9C2F0;color:#6B3AAE;background:#F6F0FC;">📅 ${esc(String(job.springer_days))} Tage</span>` : ""}
            ${job.is_springer && job.springer_wage ? `<span class="tag accent">💰 ${esc(job.springer_wage)}</span>` : ""}
            ${comp.verified ? '<span class="tag accent">✓ verifizierter Betrieb</span>' : ''}
          </div>
          <p style="font-size:15px;line-height:1.75;white-space:pre-wrap;margin-bottom:26px;color:#2A2E2A;">${esc(job.description||"")}</p>

          ${photos.length ? `
            <div style="margin-bottom:26px;">
              <div style="font-weight:700;font-size:14px;margin-bottom:10px;">Einblicke ins Team</div>
              <div style="display:flex;gap:10px;overflow-x:auto;">
                ${photos.map(url => `<img src="${url}" style="width:140px;height:100px;object-fit:cover;border-radius:10px;flex-shrink:0;">`).join("")}

            </div>

        </div>

      <button class="btn-ghost" onclick="toggleFavorite('${id}')" style="margin-left:8px;">☆ Favorit</button>
      <div id="apply-status"></div>
    </div>
  `;
}
async function applyToJob(jobId){
  const note = document.getElementById("apply-note").value;
  const { error } = await sb.from("applications").insert({ job_id: jobId, candidate_id: currentSession.user.id, cover_note: note });
  const statusEl = document.getElementById("apply-status");
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  statusEl.className="msg ok"; statusEl.textContent = "✓ Bewerbung gesendet.";
  setTimeout(() => viewJobDetail(jobId), 700);
}
async function toggleFavorite(jobId){
  if (!currentSession) { location.hash = "#/login"; return; }
  await sb.from("favorites").upsert({ candidate_id: currentSession.user.id, job_id: jobId });
  alert("Zu Favoriten hinzugefügt ☆");
}

/* ---------------- CHAT ---------------- */
async function viewChat(applicationId){
  if (!currentSession) { location.hash = "#/login"; return; }
  setApp(`
    <div class="container" style="padding:40px 32px 80px;">
      <h1 style="font-size:22px;margin-bottom:18px;">Nachrichten</h1>
      <div class="panel" style="padding:0;overflow:hidden;display:flex;flex-direction:column;height:460px;">
        <div id="chat-messages" style="flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
        <div style="display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);">
          <input id="chat-input" placeholder="Nachricht schreiben…" onkeydown="if(event.key==='Enter')sendMessage('${applicationId}')">
          <button class="btn-primary" onclick="sendMessage('${applicationId}')">Senden</button>
        </div>
      </div>
    </div>
  `);
  await loadMessages(applicationId);
}
async function loadMessages(applicationId){
  const { data } = await sb.from("messages").select("*").eq("application_id", applicationId).order("created_at",{ascending:true});
  const box = document.getElementById("chat-messages");
  if (!box) return;
  box.innerHTML = (data||[]).map(m => `
    <div style="display:flex;justify-content:${m.sender_id===currentSession.user.id?'flex-end':'flex-start'};">
      <div style="max-width:70%;background:${m.sender_id===currentSession.user.id?'var(--pine)':'var(--panel)'};color:${m.sender_id===currentSession.user.id?'#fff':'#1A1D1A'};padding:10px 14px;border-radius:12px;font-size:14px;">
        ${esc(m.body)}
      </div>
    </div>
  `).join("") || `<div style="color:var(--text2);font-size:13px;text-align:center;margin-top:20px;">Noch keine Nachrichten. Schreib die erste!</div>`;
  box.scrollTop = box.scrollHeight;
}
async function sendMessage(applicationId){
  const input = document.getElementById("chat-input");
  const body = input.value.trim();
  if (!body) return;
  input.value = "";
  await sb.from("messages").insert({ application_id: applicationId, sender_id: currentSession.user.id, body });
  await loadMessages(applicationId);
}

        ${p.cv_url ? `<a href="${p.cv_url}" target="_blank" style="font-size:13px;color:var(--amber-dark);">✓ Aktuellen Lebenslauf ansehen</a>` : ""}
      </div>
      <div id="p-status"></div>
      <button class="btn-primary" style="width:100%;" onclick="saveProfile()">Profil speichern</button>
  `, 480));
}
async function saveProfile(){
  const statusEl = document.getElementById("p-status");
  statusEl.className="msg"; statusEl.textContent="Speichert…";
  let cv_url = currentProfile?.cv_url || null;
  const file = document.getElementById("p-cv").files[0];
  if (file) {
    const path = `${currentSession.user.id}/${file.name}`;
    const { error: upErr } = await sb.storage.from("resumes").upload(path, file, { upsert: true });
    if (upErr) { statusEl.className="msg error"; statusEl.textContent = upErr.message; return; }
    const { data: pub } = sb.storage.from("resumes").getPublicUrl(path);
    cv_url = pub.publicUrl;
  }
  const { error } = await sb.from("profiles").update({
    first_name: document.getElementById("p-first").value,
    last_name: document.getElementById("p-last").value,
    profession: document.getElementById("p-profession").value,
    canton: document.getElementById("p-canton").value,
    cv_url,
  }).eq("id", currentSession.user.id);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  await refreshSession();
  statusEl.className="msg ok"; statusEl.textContent = "✓ Profil gespeichert.";
}

        </div>

      <div id="c-status"></div>
      <button class="btn-primary" style="width:100%;" onclick="saveCompany('${comp?.id||""}')">Speichern</button>
  `, 520));
}
async function saveCompany(existingId){
  const statusEl = document.getElementById("c-status");
  statusEl.className="msg"; statusEl.textContent="Speichert…";
  let photo_urls;
  const files = document.getElementById("c-photos").files;
  if (files && files.length) {
    const { data: existing } = await sb.from("companies").select("photo_urls").eq("owner_id", currentSession.user.id).maybeSingle();
    photo_urls = existing?.photo_urls || [];
    for (const file of files) {
      const path = `${currentSession.user.id}/${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from("company-photos").upload(path, file, { upsert: true });
      if (!upErr) {
        const { data: pub } = sb.storage.from("company-photos").getPublicUrl(path);
        photo_urls.push(pub.publicUrl);
      }
    }
  }
  const payload = {
    owner_id: currentSession.user.id,
    name: document.getElementById("c-name").value,
    place: document.getElementById("c-place").value,
    canton: document.getElementById("c-canton").value,
    phone: document.getElementById("c-phone").value,
    email: document.getElementById("c-email").value,
    description: document.getElementById("c-desc").value,
  };
  if (photo_urls) payload.photo_urls = photo_urls;
  if (existingId) payload.id = existingId;
  const { error } = await sb.from("companies").upsert(payload, existingId ? { onConflict: "id" } : undefined);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  location.hash = "#/post-job";
}

      <button class="btn-primary" style="width:100%;${springerMode?'background:#8A4FD1;box-shadow:0 2px 8px rgba(138,79,209,0.35);':''}" onclick="submitJob('${comp.id}')">${springerMode?'Ferien-Aushilfe veröffentlichen':'Stelle veröffentlichen'}</button>
  `, 560));
  const springerBox = document.getElementById("j-springer");
  springerBox.addEventListener("change", (e) => {
    document.getElementById("j-springer-dur-wrap").style.display = e.target.checked ? "block" : "none";
  });
  document.getElementById("j-photo").addEventListener("change", (e) => {
    const file = e.target.files[0];
    const prev = document.getElementById("j-photo-preview");
    prev.innerHTML = file ? `<img src="${URL.createObjectURL(file)}">` : "";
  });
}
async function submitJob(companyId){
  const statusEl = document.getElementById("j-status");
  statusEl.className="msg"; statusEl.textContent="Wird veröffentlicht…";
  const isSpringer = document.getElementById("j-springer").checked;
  let image_url = null;
  const file = document.getElementById("j-photo").files[0];
  if (file) {
    const path = `${companyId}/${Date.now()}-${file.name}`;
    const { error: upErr } = await sb.storage.from("job-photos").upload(path, file, { upsert: true });
    if (!upErr) { const { data: pub } = sb.storage.from("job-photos").getPublicUrl(path); image_url = pub.publicUrl; }
  }
  const payload = {
    company_id: companyId,
    title: document.getElementById("j-title").value,
    profession: document.getElementById("j-profession").value,
    canton: document.getElementById("j-canton").value,
    place: document.getElementById("j-place").value,
    employment_type: document.getElementById("j-type").value,
    pensum: document.getElementById("j-pensum").value,
    description: document.getElementById("j-desc").value,
    is_springer: isSpringer,
    springer_duration: isSpringer ? document.getElementById("j-springer-dur").value : null,
    springer_days: isSpringer ? (document.getElementById("j-springer-days").value || null) : null,
    springer_wage: isSpringer ? document.getElementById("j-springer-wage").value : null,
    image_url,
    status: "published",
  };
  if (!payload.title || !payload.place) { statusEl.className="msg error"; statusEl.textContent = "Titel und Ort ausfüllen."; return; }
  const { error } = await sb.from("jobs").insert(payload);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  statusEl.className="msg ok"; statusEl.textContent = "✓ Veröffentlicht! Du wirst weitergeleitet…";
  setTimeout(() => location.hash = isSpringer ? "#/springer" : "#/", 900);
}

async function publishJob(id){ await sb.from("jobs").update({status:"published"}).eq("id",id); viewAdmin(); }
async function rejectJob(id){ await sb.from("jobs").update({status:"closed"}).eq("id",id); viewAdmin(); }

/* ---------------- ROUTER ---------------- */
async function router(){
  renderNav();
  const hash = (location.hash || "#/").split("?")[0];
  const jobMatch = hash.match(/^#\/job\/(.+)$/);
  const chatMatch = hash.match(/^#\/chat\/(.+)$/);
  window.scrollTo(0,0);
  if (hash === "#/" || hash === "") await viewHome();
  else if (hash === "#/jobs") await viewJobs();
  else if (jobMatch) await viewJobDetail(jobMatch[1]);
  else if (chatMatch) await viewChat(chatMatch[1]);
  else if (hash === "#/springer") await viewSpringer();
  else if (hash === "#/cantons") await viewCantons();
  else if (hash === "#/register") viewRegister();
  else if (hash === "#/login") viewLogin();
  else if (hash === "#/profile") await viewProfile();
  else if (hash === "#/company") await viewCompany();
  else if (hash === "#/post-job") await viewPostJob();
  else if (hash === "#/pricing") viewPricing();
  else if (hash === "#/about") viewAbout();
  else if (hash === "#/favorites") await viewFavorites();
  else if (hash === "#/my-applications") await viewMyApplications();
  else if (hash === "#/employer-dashboard") await viewEmployerDashboard();
  else if (hash === "#/admin") await viewAdmin();
  else setApp(`<div class="container" style="padding:40px 32px;"><div class="panel">Seite nicht gefunden. <a href="#/">Zurück zur Startseite</a></div></div>`);
}

window.addEventListener("hashchange", router);
(async function init(){
  await refreshSession();
  router();
})();
</script>
