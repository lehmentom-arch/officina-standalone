<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicarr — 3D Branchen-Wechsel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --navy-deep:#0A1420; --navy:#101E30; --navy-2:#16283C;
  --teal:#14B8A6; --teal-bright:#2FE6C9; --teal-dark:#0F9488;
  --line:#E3E7F0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:radial-gradient(120% 100% at 50% 0%, #0F2A38 0%, var(--navy) 45%, var(--navy-deep) 100%);color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.mono{font-family:'IBM Plex Mono',monospace;}

.float-nav{max-width:1180px;margin:28px auto 0;padding:12px 14px 12px 26px;background:rgba(16,30,48,0.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.1);border-radius:60px;display:flex;align-items:center;justify-content:space-between;}
.float-nav .logo{font-weight:800;font-size:17px;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
.float-nav .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--teal-bright);box-shadow:0 0 10px var(--teal-bright);}

.wrap{max-width:1180px;margin:0 auto;padding:70px 26px 100px;}
.h1{font-size:clamp(30px,4.5vw,50px);font-weight:800;letter-spacing:-.02em;text-align:center;max-width:700px;margin:0 auto 46px;line-height:1.15;}
.h1 em{font-style:normal;background:linear-gradient(90deg,var(--teal-bright),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* tabs */
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:60px;flex-wrap:wrap;}
.tab{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:11px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.65);cursor:pointer;transition:all .25s;}
.tab:hover{border-color:rgba(47,230,201,0.4);color:#fff;}
.tab.active{background:var(--teal);color:#04231e;border-color:var(--teal);font-weight:700;}

/* 3D stage */
.stage{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
@media (max-width:820px){.stage{grid-template-columns:1fr;}}
.stage-3d{perspective:1200px;height:420px;display:flex;align-items:center;justify-content:center;position:relative;}
.stage-3d::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle, rgba(20,184,166,0.25), transparent 70%);filter:blur(20px);}
.obj{position:relative;width:220px;height:220px;transform-style:preserve-3d;transition:transform .15s linear;animation:floatY 4s ease-in-out infinite;}
@keyframes floatY{0%,100%{transform:translateY(0) rotateX(8deg) rotateY(var(--ry,0deg));}50%{transform:translateY(-18px) rotateX(8deg) rotateY(var(--ry,0deg));}}
.obj-face{position:absolute;inset:0;border-radius:32px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 40px 70px -20px rgba(0,0,0,0.6);}
.obj-front{background:linear-gradient(150deg, var(--c1), var(--c2));transform:translateZ(40px);}
.obj-back{background:linear-gradient(150deg, var(--c2), var(--c1));transform:rotateY(180deg) translateZ(40px);}
.obj-icon{width:100px;height:100px;color:#fff;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35));}
.obj-side{position:absolute;width:80px;height:220px;top:0;background:var(--c2);filter:brightness(0.7);}
.obj-side.left{left:0;transform:rotateY(-90deg) translateZ(40px) translateX(-40px);transform-origin:left;}
.obj-side.right{right:0;transform:rotateY(90deg) translateZ(40px) translateX(40px);transform-origin:right;width:80px;}

.stage-info{}
.stage-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:14px;}
.stage-title{font-size:32px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;}
.stage-desc{font-size:15px;color:rgba(255,255,255,0.6);line-height:1.65;margin-bottom:26px;max-width:420px;}
.stage-stats{display:flex;gap:28px;}
.stage-stats div b{display:block;font-size:24px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--teal-bright);}
.stage-stats div span{font-size:12px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.04em;}
.stage-cta{display:inline-flex;align-items:center;gap:9px;margin-top:30px;background:var(--teal);color:#04231e;font-weight:700;font-size:14.5px;padding:14px 26px;border-radius:40px;}
</style>
</head>
<body>

<div class="float-nav">
  <div class="logo"><span class="dot"></span>MEDICARR.CH</div>
</div>

<div class="wrap">
  <h1 class="h1">Finde deinen <em>Fachbereich</em> — in 3D.</h1>

  <div class="tabs" id="tabs">
    <button class="tab active" data-key="hospital">Spitalpersonal</button>
    <button class="tab" data-key="pharmacy">Pharmazie</button>
    <button class="tab" data-key="dental">Zahnmedizin</button>
    <button class="tab" data-key="practice">Arztpraxis</button>
  </div>

  <div class="stage">
    <div class="stage-3d">
      <div class="obj" id="obj" style="--c1:#14B8A6;--c2:#0F9488;">
        <div class="obj-side left"></div>
        <div class="obj-side right"></div>
        <div class="obj-face obj-front" id="iconFront">
          <svg class="obj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
        <div class="obj-face obj-back" id="iconBack">
          <svg class="obj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
      </div>
    </div>

    <div class="stage-info">
      <div class="stage-tag">01 — Spitalpersonal</div>
      <div class="stage-title" id="title">Pflege &amp; Spital</div>
      <p class="stage-desc" id="desc">Pflegefachpersonen, Ärzt:innen, FaGe und Spitalpersonal — offene Stellen und Kurzeinsätze schweizweit.</p>
      <div class="stage-stats">
        <div><b id="statJobs">9</b><span>Offene Stellen</span></div>
        <div><b id="statCantons">18</b><span>Kantone</span></div>
      </div>
      <a href="#" class="stage-cta">Stellen ansehen →</a>
    </div>
  </div>
</div>

<script>
const DATA = {
  hospital: { colors:['#14B8A6','#0F9488'], icon:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>', tag:'01 — Spitalpersonal', title:'Pflege & Spital', desc:'Pflegefachpersonen, Ärzt:innen, FaGe und Spitalpersonal — offene Stellen und Kurzeinsätze schweizweit.', jobs:9, cantons:18 },
  pharmacy: { colors:['#2E86C1','#1F5C87'], icon:'<circle cx="9" cy="9" r="6"/><path d="m15 15 6 6"/>', tag:'02 — Pharmazie', title:'Apotheke & Pharma', desc:'Apotheker:innen und Pharma-Assistent:innen — von Grossverteiler-Apotheken bis zur Quartier-Offizin.', jobs:15, cantons:22 },
  dental: { colors:['#7C6FE0','#4E3FAE'], icon:'<path d="M12 5.5c-1.5-2-6-2.5-8 0-2.5 3-1 8 1 12 1 2 2 3.5 3 3.5s1.2-2.6 2-4c.5-.9 1-1 2-1s1.5.1 2 1c.8 1.4 1 4 2 4s2-1.5 3-3.5c2-4 3.5-9 1-12-2-2.5-6.5-2-8 0Z"/>', tag:'03 — Zahnmedizin', title:'Zahnmedizin', desc:'Zahnärzt:innen, Dentalhygiene und Praxispersonal für Zahnarztpraxen in der ganzen Schweiz.', jobs:6, cantons:14 },
  practice: { colors:['#E08A2E','#B5691A'], icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>', tag:'04 — Arztpraxis', title:'Arztpraxispersonal', desc:'MPA, Praxismanager:innen und medizinisches Praxispersonal für Hausarzt- und Facharztpraxen.', jobs:4, cantons:11 },
};
let current = 'hospital';
let flipped = false;
const objEl = document.getElementById('obj');
const frontEl = document.getElementById('iconFront');
const backEl = document.getElementById('iconBack');

function render(key){
  const d = DATA[key];
  document.getElementById('title').textContent = d.title;
  document.getElementById('desc').textContent = d.desc;
  document.getElementById('statJobs').textContent = d.jobs;
  document.getElementById('statCantons').textContent = d.cantons;
  document.querySelector('.stage-tag').textContent = d.tag;

  // set the face that's about to become visible, then flip
  const targetFace = flipped ? frontEl : backEl;
  targetFace.innerHTML = `<svg class="obj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${d.icon}</svg>`;
  objEl.style.setProperty('--c1', d.colors[0]);
  objEl.style.setProperty('--c2', d.colors[1]);

  flipped = !flipped;
  const ry = flipped ? 180 : 0;
  objEl.style.setProperty('--ry', ry + 'deg');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.key);
});
</script>

</body>
</html>
